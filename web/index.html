<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23F6F5F1'/%3E%3Cpath d='M8 17l5 5 11-12' fill='none' stroke='%23C2410C' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>topicalpaper.me</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      (function () {
        var theme = 'system', paper = false
        try {
          theme = localStorage.getItem('tp:theme') || 'system'
          paper = localStorage.getItem('tp:dark-paper') === '1'
        } catch (e) {}
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.paper = dark && paper ? 'dark' : 'light'
      })()
    </script>
    <script>
      // Vercel Web Analytics, as on the classic pages. Skipped locally, where the
      // script doesn't exist; added from JS so the dev server doesn't rebase its path.
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments) }
      if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
        var va = document.createElement('script')
        va.defer = true
        va.src = '/_vercel/insights/script.js'
        document.head.appendChild(va)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
